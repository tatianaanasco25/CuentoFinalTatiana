<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuento Infantil e Inclusivo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <header class="header">
        <h1>📖 Cuento Mágico</h1>
        
        <div class="controls-container">
            <!-- Lectura en Voz Alta -->
            <div class="control-group">
                <button id="tts-btn" class="btn btn-audio" aria-label="Leer en voz alta en español">
                    🔊 Leer en voz alta
                </button>
            </div>

            <!-- Controles de Tamaño / Zoom -->
            <div class="control-group">
                <button id="zoom-in-btn" class="btn btn-zoom" aria-label="Agrandar vista">
                    🔍➕ Agrandar
                </button>
                <button id="zoom-out-btn" class="btn btn-zoom" aria-label="Achicar vista">
                    🔍➖ Achicar
                </button>
                <button id="zoom-reset-btn" class="btn btn-zoom" aria-label="Restablecer tamaño normal">
                    🔄 Normal
                </button>
            </div>

            <!-- Sonido de Pájaros -->
            <div class="control-group">
                <button id="bird-sound-btn" class="btn btn-birds" aria-label="Activar o desactivar sonido de pájaros">
                    🐤 Pájaros: OFF
                </button>
            </div>

            <!-- Indicador de Página -->
            <div class="control-group">
                <span id="page-info" class="page-info">Página 1</span>
            </div>
        </div>

        <div id="loading">✨ Cargando tu cuento...</div>
    </header>

    <!-- Botones de Navegación Lateral en Forma de Corazón -->
    <button id="prev-btn" class="btn-heart-side left-heart" aria-label="Página anterior" title="Página anterior">
        <span class="heart-icon">🩷</span>
    </button>
    
    <button id="next-btn" class="btn-heart-side right-heart" aria-label="Página siguiente" title="Página siguiente">
        <span class="heart-icon">🩷</span>
    </button>

    <main class="book-container">
        <!-- Contenedor del libro -->
        <div id="flip-book" class="flip-book"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
